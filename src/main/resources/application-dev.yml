spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ormcourse.platform: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production}
